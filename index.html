<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emmanuelle Picaud</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<meta property="og:title" content="Emmanuelle Picaud — Journalist">
<meta property="og:description" content="Investigations, environment, urbanism, public policy, financial flows">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  --ink: #1a1a1a;
  --muted: #5c5c5c;
  --line: #ddc9bd;
  --accent: #5c2a3a;
  --bg: #efe0da;
  --maxw: 760px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  line-height: 1.55;
}

article {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 64px 24px 80px;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}

.lang-switch {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  white-space: nowrap;
  margin-top: 4px;
}
.lang-switch button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-family: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  padding: 2px 4px;
}
.lang-switch button.active {
  color: var(--accent);
  font-weight: 700;
  border-bottom: 1px solid var(--accent);
}
.lang-switch span.sep { color: var(--line); }

.about h1 {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: 28px;
  letter-spacing: 3px;
  font-weight: 700;
  margin: 0 0 18px;
}

.about p {
  font-size: 17px;
  color: var(--ink);
  margin: 6px 0;
}

.about p.tagline { color: var(--muted); }

.about a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 2px solid rgba(92,42,58,0.4);
  transition: border-bottom-color 0.2s ease;
}
.about a:hover { border-bottom-color: var(--accent); }

.sociallinks { margin-top: 14px !important; }

.divider {
  border: none;
  border-top: 1px solid var(--line);
  margin: 44px 0;
}

.highlights h2 {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--muted);
  margin: 48px 0 18px;
}

.highlights h2:first-of-type { margin-top: 0; }

.highlights h3 {
  margin: 26px 0 4px;
  font-size: 19px;
  line-height: 1.35;
}

a.linktitle {
  color: var(--ink);
  text-decoration: none;
  background-image: linear-gradient(var(--accent), var(--accent));
  background-position: 0 100%;
  background-repeat: no-repeat;
  background-size: 30% 2px;
  transition: background-size 0.25s ease;
}
a.linktitle:hover { background-size: 100% 2px; }

.highlights p {
  margin: 4px 0 0;
  font-size: 16px;
  color: var(--muted);
}

.highlights em {
  font-style: normal;
  color: #8a8a8a;
  font-size: 13.5px;
  letter-spacing: 0.2px;
}

@media (max-width: 480px) {
  .about h1 { font-size: 24px; letter-spacing: 2px; }
  article { padding: 40px 18px 60px; }
  .top-row { flex-direction: column; }
}
</style>
</head>
<body>
<article>

  <div class="top-row">
    <div class="about">
      <h1>EMMANUELLE PICAUD</h1>
    </div>
    <div class="lang-switch" role="group" aria-label="Language switch">
      <button type="button" data-setlang="fr">FR</button><span class="sep"> / </span><button type="button" data-setlang="en" class="active">EN</button>
    </div>
  </div>

  <div class="about">

    <p data-fr="🔎 Journaliste, je travaille principalement sur des sujets à l'échelle française et européenne : évaluation des politiques publiques, reporting environnemental des industriels, suivi des chaînes d'approvisionnement et analyse des flux financiers."
       data-en="🔎 Investigative journalist covering French and European public policy, environmental reporting, supply chains and financial flows."></p>

    <p class="tagline"
       data-fr="🛠️ Mon travail combine entretiens, terrain, recherche documentaire, OSINT, demandes d'accès aux documents administratifs (FOI) et coordination de projets transfrontaliers. Formée à Python, je réalise des analyses de données et développe aussi des outils d'enquête (scrapers, IA, browser automation)."
       data-en="🛠️ My reporting combines interviews, field investigations, document research, OSINT, freedom of information requests and cross-border collaborations. I also use Python to analyse data and build investigative tools, including web scrapers, AI-assisted classification and browser automation."></p>

    <p data-fr="Mes enquêtes ont été publiées dans des médias comme <strong>Le Monde</strong> (France), la <strong>BBC</strong> (UK), <strong>Le Temps</strong> (Suisse), <strong>elDiario.es</strong> (Espagne), le <strong>Tagesspiegel</strong> (Allemagne) et <strong>Mongabay</strong> (US). Également diplômée en urbanisme, j'écris aussi régulièrement des articles d'analyse et de décryptage pour la presse spécialisée, où j'ai évolué pendant plusieurs années. J'ai été formée à l'ESJ de Lille et à la Columbia journalism school (programme Lede)."
       data-en="My work has been published by <strong>Le Monde</strong> (France), the <strong>BBC</strong> (UK), <strong>Le Temps</strong> (Switzerland), <strong>elDiario.es</strong> (Spain), the <strong>Tagesspiegel</strong> (Germany) and <strong>Mongabay</strong> (US). I also hold a degree in urban planning and I am an alumna of Columbia Journalism School's Lede Program."></p>

    <p class="sociallinks"><a href="mailto:emma.picaud@gmail.com">Email</a> · <a href="https://www.linkedin.com/in/emmanuelle-picaud-87b3b178/" target="_blank" rel="noopener noreferrer">LinkedIn</a> · <a href="https://github.com/emmapicaud" target="_blank" rel="noopener noreferrer">GitHub</a></p>

  </div>

  <hr class="divider">

  <div class="highlights">

    <h2 data-fr="Sélection d'enquêtes" data-en="Selected investigations"></h2>

    <h2 data-fr="👗 Chaînes d'approvisionnement textiles" data-en="👗 Textile supply chains"></h2>

    <h3><a class="linktitle" href="https://www.journalismfund.eu/circular-fashions-dirty-detour" target="_blank" rel="noopener noreferrer">Circular Fashion's Dirty Detour</a></h3>
    <p data-fr="À partir de données douanières exclusives, de traceurs GPS placés sur des vêtements et d'une analyse de l'empreinte carbone, l'enquête montre comment le tri des invendus européens est externalisé vers des pays aux normes sociales et environnementales plus faibles.<br><em>Le Monde avec Journalismfund Europe, 2025</em>"
       data-en="Using exclusive customs data, GPS trackers placed on garments, and carbon footprint analysis, the investigation reveals how the sorting of Europe's unsold clothes is outsourced to countries with weaker social and environmental standards.<br><em>Le Monde withJournalismfund Europe, 2025</em>"></p>

    <h2 data-fr="🏚️ Rénovation énergétique &amp; politiques publiques" data-en="🏚️ Energy renovation &amp; public policy"></h2>

    <h3><a class="linktitle" href="https://urbanjournalism.org/energy-trap/" target="_blank" rel="noopener noreferrer">Energy Trap</a></h3>
    <p data-fr="Enquête collective menée avec des médias de huit pays européens sur l'échec des politiques de rénovation énergétique des logements, alors que la précarité énergétique touche des dizaines de millions de foyers en Europe.<br><em>Urban Journalism Network, coordination transfrontalière, 2025</em>"
       data-en="A collaborative investigation with media from eight European countries on the failure of energy renovation policies for housing, as energy poverty affects tens of millions of households across Europe.<br><em>Urban Journalism Network, cross-border investigation, 2025</em>"></p>

    <h2 data-fr="🏭 Sidérurgie verte &amp; compensation carbone" data-en="🏭 Green steel &amp; carbon offsetting"></h2>

    <h3><a class="linktitle" href="https://www.journalismfund.eu/green-steel-mirage" target="_blank" rel="noopener noreferrer">Green Steel Mirage</a></h3>
    <p data-fr="Au Brésil, la fabrication d'acier « vert » à partir de biomasse d'eucalyptus menace les ressources en eau des communautés locales, pendant qu'à Bruxelles les lobbies sidérurgistes tentent de peser sur la définition européenne de l'acier vert.<br><em>L'Humanité and Mongabay with Journalismfund Europe, 2025</em>"
       data-en="In Brazil, the production of 'green steel' from eucalyptus biomass threatens local water resources, while in Brussels, steel industry lobbies seek to influence the EU's definition of green steel.<br><em>L'Humanité and Mongabay withJournalismfund Europe, 2025</em>"></p>

    <h2 data-fr="🇪🇺 Marché carbone européen" data-en="🇪🇺 European carbon market"></h2>

    <h3><a class="linktitle" href="https://investigativejournalismforeu.net/projects/cashing-in-on-carbon-credits/" target="_blank" rel="noopener noreferrer">Cashing in on Carbon Credits</a></h3>
    <p data-fr="Enquête transfrontalière coordonnée par Emmanuelle Picaud avec Guillaume Delacroix et Luc Martinon, publiée dans Le Monde et elDiario.es, révélant comment des industriels ont revendu leurs quotas gratuits excédentaires, pour plusieurs milliards d'euros de profits.<br><em>Le Monde and El Diario.es avec IJ4EU — France, Espagne, Allemagne, 2023</em>"
       data-en="A cross-border investigation coordinated by Emmanuelle Picaud with Guillaume Delacroix and Luc Martinon, published in Le Monde and elDiario.es, revealing how industries used their free carbon quotas as financial instruments rather than climate tools.<br><em>Le Monde and El Diario?es with IJ4EU — France, Spain, Germany, 2023</em>"></p>

  </div>

</article>

<script>
(function(){
  function setLanguage(lang){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-fr]").forEach(function(el){
      el.innerHTML = el.dataset[lang];
    });
    document.querySelectorAll("[data-setlang]").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-setlang") === lang);
    });
    try { localStorage.setItem("picaud-lang", lang); } catch(e){}
  }
  document.querySelectorAll("[data-setlang]").forEach(function(b){
    b.addEventListener("click", function(){ setLanguage(b.getAttribute("data-setlang")); });
  });
  var saved = null;
  try { saved = localStorage.getItem("picaud-lang"); } catch(e){}
  var initial = saved || (((navigator.language||"fr").startsWith("fr")) ? "fr" : "en");
  setLanguage(initial);
})();
</script>
</body>
</html>
